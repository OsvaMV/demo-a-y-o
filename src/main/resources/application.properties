spring.application.name=proyecto-a-o

# Base de datos H2 en memoria: se crea vacia en cada arranque y se pierde al detener la app
spring.datasource.url=jdbc:h2:mem:proyectoaodb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Ejecuta schema.sql en cada arranque para crear la estructura de tablas
spring.sql.init.mode=always

# JPA solo mapea sobre el esquema creado por schema.sql, no genera ni modifica DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Consola web de H2 (servidor propio de H2, independiente de WebFlux)
h2.console.port=8082

# JWT: clave usada para firmar/validar los tokens (HS256 exige minimo 32 caracteres).
# DEMO: en un despliegue real esto debe venir de una variable de entorno, no del repo.
security.jwt.secret=proyecto-a-o-clave-secreta-demo-cambiar-en-produccion-32+
security.jwt.expiration-minutes=60
