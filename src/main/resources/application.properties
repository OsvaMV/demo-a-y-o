spring.application.name=proyecto-a-o

# Base de datos H2 en memoria: se crea vacia en cada arranque y se pierde al detener la app
spring.datasource.url=jdbc:h2:mem:proyectoaodb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Ejecuta schema.sql en cada arranque para crear la estructura de tablas
spring.sql.init.mode=always

# JPA solo mapea sobre el esquema creado por schema.sql, no genera ni modifica DDL
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Consola web de H2 (servidor propio de H2, independiente de WebFlux)
h2.console.port=8082
