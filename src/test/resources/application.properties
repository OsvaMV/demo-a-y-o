# La consola web de H2 es una utilidad de desarrollo; se desactiva en tests
# para que no compita por el puerto entre los distintos contextos de Spring.
h2.console.enabled=false

# JWT: mismo valor que en main, repetido aqui porque application.properties de test
# reemplaza por completo (no fusiona) el de main al ejecutar los tests.
security.jwt.secret=proyecto-a-o-clave-secreta-demo-cambiar-en-produccion-32+
security.jwt.expiration-minutes=60
